
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR CROUS - Transformation magique</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/crous.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Contenu affiché lorsque l'enseigne est reconnue -->
    

<a-entity mindar-image-target="targetIndex: 0">

  <!-- Surface opaque qui masque l'enseigne originale -->
  <a-plane
    position="0 0 0.02"
    width="1"
    height="0.375"
    material="
      shader: flat;
      color: #21152F;
      side: double;
      transparent: false;
      depthWrite: true
    ">
  </a-plane>

  <!-- Bordure dorée -->
  <a-plane
    position="0 0 0.025"
    width="0.98"
    height="0.355"
    material="
      shader: flat;
      color: #6C3D83;
      side: double
    ">
  </a-plane>

  <a-plane
    position="0 0 0.03"
    width="0.965"
    height="0.34"
    material="
      shader: flat;
      color: #21152F;
      side: double
    ">
  </a-plane>

  <!-- Message de test -->
  <a-text
    value="LA CAFETERIA ENCHANTEE"
    position="0 0 0.04"
    align="center"
    color="#FFD98A"
    width="1.5"
    shader="msdf">
  </a-text>

</a-entity>



  </a-scene>

</body>
</html>
