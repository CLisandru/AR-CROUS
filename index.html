
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR CROUS - Transformation magique</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/crous.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- CAMERA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- CONTENU AR -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- FOND GENERAL -->
      <a-plane
        position="0 0 0.02"
        width="1"
        height="0.375"
        material="shader: flat; color: #21152F; side: double">
      </a-plane>

      <!-- BANDE SUPERIEURE -->
      <a-plane
        position="0 0.095 0.025"
        width="0.98"
        height="0.165"
        material="shader: flat; color: #382044; side: double">
      </a-plane>

      <!-- BANDE INFERIEURE -->
      <a-plane
        position="0 -0.095 0.025"
        width="0.98"
        height="0.185"
        material="shader: flat; color: #171322; side: double">
      </a-plane>

      <!-- SEPARATION DOREE -->
      <a-box
        position="0 0.008 0.035"
        width="0.96"
        height="0.004"
        depth="0.004"
        color="#E8BD69">
      </a-box>


      <!-- MEDAILLON CROUS ENCHANTE -->

      <a-entity position="-0.405 0.105 0.055">

        <!-- Volume et ombre -->
        <a-cylinder
          radius="0.069"
          height="0.025"
          rotation="90 0 0"
          color="#6D2638"
          position="0 0 -0.012">
        </a-cylinder>

        <!-- Fond rouge -->
        <a-cylinder
          radius="0.064"
          height="0.012"
          rotation="90 0 0"
          color="#A92742">
        </a-cylinder>

        <!-- Bordure dorée extérieure -->
        <a-torus
          radius="0.066"
          radius-tubular="0.006"
          color="#FFD477"
          material="
            metalness: 0.8;
            roughness: 0.2;
            emissive: #A66A19;
            emissiveIntensity: 0.8">
        </a-torus>

        <!-- Bordure intérieure -->
        <a-torus
          position="0 0 0.004"
          radius="0.055"
          radius-tubular="0.002"
          color="#FFE6A6">
        </a-torus>

        <!-- Texte CROUS -->
        <a-text
          value="CROUS"
          position="0 0.008 0.012"
          align="center"
          anchor="center"
          color="#FFFFFF"
          width="0.19">
        </a-text>

        <!-- Texte COM -->
        <a-text
          value="COM"
          position="0 -0.019 0.012"
          align="center"
          anchor="center"
          color="#FFE4B0"
          width="0.09">
        </a-text>

        <!-- Eclat lumineux -->
        <a-sphere
          position="0.045 0.045 0.015"
          radius="0.006"
          color="#FFFFFF"
          material="emissive: #FFFFFF; emissiveIntensity: 2"
          animation="
            property: scale;
            to: 1.8 1.8 1.8;
            dir: alternate;
            dur: 900;
            loop: true">
        </a-sphere>

      </a-entity>


      <!-- TITRE SUPERIEUR EN RELIEF -->

      <!-- Ombre du texte -->
      <a-text
        value="Cafétéria"
        position="-0.12 0.105 0.052"
        align="center"
        anchor="center"
        color="#8B5425"
        width="0.82">
      </a-text>

      <!-- Texte doré -->
      <a-text
        value="Cafétéria"
        position="-0.12 0.109 0.061"
        align="center"
        anchor="center"
        color="#FFD98A"
        width="0.82"
        material="emissive: #B87924; emissiveIntensity: 0.7">
      </a-text>

      <!-- Lumière décorative -->
      <a-sphere
        position="-0.12 0.155 0.065"
        radius="0.006"
        color="#FFFFFF"
        material="emissive: #FFFFFF; emissiveIntensity: 2"
        animation="
          property: scale;
          to: 1.8 1.8 1.8;
          dir: alternate;
          dur: 1200;
          loop: true">
      </a-sphere>


      <!-- TASSE ENCHANTEE -->

      <a-entity
        position="0.245 0.095 0.08"
        animation="
          property: position;
          to: 0.245 0.11 0.08;
          dir: alternate;
          dur: 1800;
          loop: true">

        <!-- Soucoupe -->
        <a-cylinder
          position="0 -0.032 0"
          radius="0.052"
          height="0.009"
          color="#D9B76C"
          material="metalness: 0.7; roughness: 0.25">
        </a-cylinder>

        <a-cylinder
          position="0 -0.025 0"
          radius="0.043"
          height="0.008"
          color="#EAD7FF">
        </a-cylinder>

        <!-- Corps de la tasse -->
        <a-cone
          position="0 0.005 0"
          radius-bottom="0.027"
          radius-top="0.039"
          height="0.065"
          color="#CFA7F5"
          material="metalness: 0.35; roughness: 0.2">
        </a-cone>

        <!-- Bord supérieur doré -->
        <a-torus
          position="0 0.038 0"
          rotation="90 0 0"
          radius="0.037"
          radius-tubular="0.003"
          color="#FFD77D">
        </a-torus>

        <!-- Café -->
        <a-circle
          position="0 0.038 0"
          rotation="-90 0 0"
          radius="0.034"
          color="#4B241B">
        </a-circle>

        <!-- Décoration de mousse -->
        <a-torus
          position="0 0.039 0"
          rotation="90 0 0"
          radius="0.018"
          radius-tubular="0.002"
          color="#D7A46D">
        </a-torus>

        <!-- Anse -->
        <a-torus
          position="0.043 0.005 0"
          rotation="90 0 90"
          radius="0.022"
          radius-tubular="0.006"
          color="#FFD77D">
        </a-torus>

        <!-- Décoration -->
        <a-sphere
          position="0 0.005 0.033"
          radius="0.008"
          color="#FFE8A8"
          material="emissive: #B87924; emissiveIntensity: 0.7">
        </a-sphere>

        <!-- Vapeur magique -->
        <a-entity position="0 0.055 0">

          <a-sphere
            radius="0.008"
            color="#FFFFFF"
            material="transparent: true; opacity: 0.65"
            animation="
              property: position;
              to: -0.008 0.055 0;
              dur: 1300;
              dir: alternate;
              loop: true">
          </a-sphere>

          <a-sphere
            position="0.012 0.015 0"
            radius="0.007"
            color="#D9B5FF"
            material="transparent: true; opacity: 0.6"
            animation="
              property: position;
              to: 0.02 0.07 0;
              dur: 1600;
              delay: 400;
              dir: alternate;
              loop: true">
          </a-sphere>

          <a-sphere
            position="-0.012 0.025 0"
            radius="0.005"
            color="#FFFFFF"
            material="transparent: true; opacity: 0.55"
            animation="
              property: position;
              to: -0.025 0.08 0;
              dur: 1800;
              delay: 800;
              dir: alternate;
              loop: true">
          </a-sphere>

        </a-entity>

      </a-entity>


      <!-- GOBELET MAGIQUE A EMPORTER -->

      <a-entity
        position="0.355 0.095 0.08"
        animation="
          property: position;
          to: 0.355 0.112 0.08;
          dir: alternate;
          dur: 1900;
          loop: true">

        <!-- Corps -->
        <a-cone
          radius-bottom="0.025"
          radius-top="0.038"
          height="0.075"
          color="#F4E8D9"
          material="roughness: 0.3">
        </a-cone>

        <!-- Bande décorative -->
        <a-cylinder
          position="0 -0.005 0"
          radius="0.034"
          height="0.018"
          color="#9C61C6">
        </a-cylinder>

        <!-- Emblème doré -->
        <a-sphere
          position="0 0 0.035"
          radius="0.009"
          color="#FFD77D"
          material="emissive: #B87924; emissiveIntensity: 0.8">
        </a-sphere>

        <!-- Couvercle -->
        <a-cylinder
          position="0 0.041 0"
          radius="0.041"
          height="0.009"
          color="#D6B5ED">
        </a-cylinder>

        <!-- Bord du couvercle -->
        <a-torus
          position="0 0.045 0"
          rotation="90 0 0"
          radius="0.038"
          radius-tubular="0.003"
          color="#FFD77D">
        </a-torus>

        <!-- Paille -->
        <a-cylinder
          position="0 0.069 0"
          radius="0.004"
          height="0.045"
          color="#FFE5A3">
        </a-cylinder>

        <!-- Eclat -->
        <a-sphere
          position="0.027 0.025 0.025"
          radius="0.005"
          color="#FFFFFF"
          material="emissive: #FFFFFF; emissiveIntensity: 2"
          animation="
            property: scale;
            to: 1.8 1.8 1.8;
            dir: alternate;
            dur: 1000;
            loop: true">
        </a-sphere>

      </a-entity>


      <!-- CUPCAKE ENCHANTE -->

      <a-entity
        position="0.445 0.095 0.08"
        animation="
          property: position;
          to: 0.445 0.11 0.08;
          dir: alternate;
          dur: 1700;
          loop: true">

        <!-- Base -->
        <a-cone
          position="0 -0.005 0"
          radius-bottom="0.025"
          radius-top="0.037"
          height="0.045"
          color="#B87950">
        </a-cone>

        <!-- Bande dorée -->
        <a-torus
          position="0 -0.015 0"
          rotation="90 0 0"
          radius="0.029"
          radius-tubular="0.003"
          color="#FFD77D">
        </a-torus>

        <!-- Glaçage principal -->
        <a-sphere
          position="0 0.029 0"
          radius="0.036"
          scale="1 0.75 1"
          color="#F59BD6"
          material="
            roughness: 0.3;
            emissive: #8E367C;
            emissiveIntensity: 0.3">
        </a-sphere>

        <!-- Glaçage supérieur -->
        <a-sphere
          position="0 0.052 0"
          radius="0.022"
          scale="1 1.1 1"
          color="#FFB8E7">
        </a-sphere>

        <!-- Décoration dorée -->
        <a-sphere
          position="0 0.079 0"
          radius="0.009"
          color="#FFE17B"
          material="metalness: 0.6; emissive: #A66A19; emissiveIntensity: 0.6">
        </a-sphere>

        <!-- Petites décorations -->
        <a-sphere
          position="-0.023 0.035 0.02"
          radius="0.004"
          color="#FFE17B">
        </a-sphere>

        <a-sphere
          position="0.021 0.035 0.02"
          radius="0.004"
          color="#FFFFFF">
        </a-sphere>

        <a-sphere
          position="0 0.02 0.034"
          radius="0.004"
          color="#D9A9FF">
        </a-sphere>

      </a-entity>


      <!-- TITRE INFERIEUR LUMINEUX -->

      <!-- Ombre violette -->
      <a-text
        value="Cafétéria"
        position="0 -0.105 0.052"
        align="center"
        anchor="center"
        color="#A66CBA"
        width="1.12">
      </a-text>

      <!-- Texte clair -->
      <a-text
        value="Cafétéria"
        position="0 -0.101 0.062"
        align="center"
        anchor="center"
        color="#FFF0D1"
        width="1.12"
        material="
          emissive: #D9A9FF;
          emissiveIntensity: 0.65">
      </a-text>


      <!-- ORNEMENTS LUMINEUX -->

      <a-sphere
        position="-0.32 -0.16 0.08"
        radius="0.008"
        color="#FFD76A"
        material="emissive: #FFD76A; emissiveIntensity: 2"
        animation="
          property: scale;
          to: 1.8 1.8 1.8;
          dir: alternate;
          dur: 900;
          loop: true">
      </a-sphere>

      <a-sphere
        position="0.32 -0.15 0.08"
        radius="0.009"
        color="#D9A9FF"
        material="emissive: #D9A9FF; emissiveIntensity: 2"
        animation="
          property: scale;
          to: 1.8 1.8 1.8;
          dir: alternate;
          dur: 1200;
          loop: true">
      </a-sphere>

      <a-sphere
        position="0.05 0.16 0.08"
        radius="0.006"
        color="#FFFFFF"
        material="emissive: #FFFFFF; emissiveIntensity: 2"
        animation="
          property: scale;
          to: 2 2 2;
          dir: alternate;
          dur: 1000;
          loop: true">
      </a-sphere>


      <!-- PARTICULES MAGIQUES SUPPLEMENTAIRES -->

      <a-sphere
        position="-0.25 0.17 0.09"
        radius="0.005"
        color="#FFD77D"
        material="emissive: #FFD77D; emissiveIntensity: 2"
        animation="
          property: position;
          to: -0.22 0.22 0.09;
          dir: alternate;
          dur: 1300;
          loop: true">
      </a-sphere>

      <a-sphere
        position="0.29 0.18 0.09"
        radius="0.006"
        color="#D9A9FF"
        material="emissive: #D9A9FF; emissiveIntensity: 2"
        animation="
          property: position;
          to: 0.32 0.23 0.09;
          dir: alternate;
          dur: 1600;
          loop: true">
      </a-sphere>

      <a-sphere
        position="0.40 0.02 0.09"
        radius="0.005"
        color="#FFFFFF"
        material="emissive: #FFFFFF; emissiveIntensity: 2"
        animation="
          property: scale;
          to: 2 2 2;
          dir: alternate;
          dur: 1100;
          loop: true">
      </a-sphere>

      <a-sphere
        position="-0.30 -0.05 0.09"
        radius="0.005"
        color="#FFD77D"
        material="emissive: #FFD77D; emissiveIntensity: 2"
        animation="
          property: position;
          to: -0.34 -0.02 0.09;
          dir: alternate;
          dur: 1400;
          loop: true">
      </a-sphere>

    </a-entity>

  </a-scene>

</body>
</html>
