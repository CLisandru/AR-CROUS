
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR CROUS - Transformation magique</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/crous.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Contenu affiché lorsque l'enseigne est reconnue -->
    


<a-entity mindar-image-target="targetIndex: 0">

  <!-- FOND GENERAL -->
  <a-plane position="0 0 0.02"
    width="1" height="0.375"
    material="shader: flat; color: #21152F; side: double">
  </a-plane>

  <!-- BANDE SUPERIEURE -->
  <a-plane position="0 0.095 0.025"
    width="0.98" height="0.165"
    material="shader: flat; color: #382044; side: double">
  </a-plane>

  <!-- BANDE INFERIEURE -->
  <a-plane position="0 -0.095 0.025"
    width="0.98" height="0.185"
    material="shader: flat; color: #171322; side: double">
  </a-plane>

  <!-- SEPARATION DOREE -->
  <a-box position="0 0.008 0.035"
    width="0.96" height="0.004" depth="0.004"
    color="#E8BD69">
  </a-box>

  <!-- MEDAILLON CROUS -->
  <a-cylinder position="-0.405 0.105 0.055"
    radius="0.065" height="0.018"
    rotation="90 0 0"
    color="#D84B58"
    material="metalness: 0.45; roughness: 0.25; emissive: #68152C; emissiveIntensity: 0.5">
  </a-cylinder>

  <a-torus position="-0.405 0.105 0.068"
    radius="0.062" radius-tubular="0.004"
    color="#FFD77D"
    material="emissive: #D99B36; emissiveIntensity: 1">
  </a-torus>

  <a-text value="CROUS"
    position="-0.405 0.11 0.08"
    align="center"
    anchor="center"
    color="#FFFFFF"
    width="0.19">
  </a-text>

  <a-text value="COM"
    position="-0.405 0.083 0.08"
    align="center"
    color="#FFE3B0"
    width="0.09">
  </a-text>

  <!-- TITRE SUPERIEUR -->
  <a-text value="Cafeteria"
    position="-0.12 0.105 0.06"
    align="center"
    anchor="center"
    color="#FFD98A"
    width="0.78"
    material="emissive: #B87924; emissiveIntensity: 0.7">
  </a-text>

  <!-- TASSE 3D -->
  <a-entity position="0.245 0.095 0.08">

    <a-cylinder position="0 0 0"
      radius="0.033" height="0.045"
      color="#E7C5FF">
    </a-cylinder>

    <a-circle position="0 0.024 0"
      rotation="-90 0 0"
      radius="0.029"
      color="#63351F">
    </a-circle>

    <a-torus position="0.039 0 0"
      rotation="90 0 90"
      radius="0.018"
      radius-tubular="0.005"
      color="#FFD98A">
    </a-torus>

    <a-cylinder position="0 -0.027 0"
      radius="0.045" height="0.007"
      color="#FFD98A">
    </a-cylinder>

    <a-entity position="0 0.04 0">
      <a-sphere radius="0.009"
        color="#FFFFFF"
        material="transparent: true; opacity: 0.65"
        animation="property: position; to: 0 0.05 0; dur: 1200; loop: true; dir: alternate">
      </a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 10000; loop: true">
    </a-entity>
  </a-entity>

  <!-- GOBELET A EMPORTER -->
  <a-entity position="0.355 0.095 0.08"
    animation="property: position; to: 0.355 0.11 0.08; dir: alternate; dur: 1800; loop: true">

    <a-cone radius-bottom="0.032"
      radius-top="0.022"
      height="0.075"
      color="#F3E8D9">
    </a-cone>

    <a-cylinder position="0 0.042 0"
      radius="0.025" height="0.008"
      color="#D99B54">
    </a-cylinder>

    <a-cylinder position="0 0.055 0"
      radius="0.004" height="0.04"
      color="#FFFFFF">
    </a-cylinder>
  </a-entity>

  <!-- CUPCAKE -->
  <a-entity position="0.445 0.095 0.08"
    animation="property: rotation; to: 0 0 8; dir: alternate; dur: 1600; loop: true">

    <a-cone radius-bottom="0.028"
      radius-top="0.038"
      height="0.045"
      color="#C98B60">
    </a-cone>

    <a-sphere position="0 0.035 0"
      radius="0.035"
      scale="1 0.8 1"
      color="#FF9FD8"
      material="emissive: #A52C80; emissiveIntensity: 0.5">
    </a-sphere>

    <a-sphere position="0 0.062 0"
      radius="0.009"
      color="#FFE17B">
    </a-sphere>
  </a-entity>

  <!-- TITRE INFERIEUR -->
  <a-text value="Cafeteria"
    position="0 -0.105 0.06"
    align="center"
    anchor="center"
    color="#FFF0D1"
    width="1.1"
    material="emissive: #D9A9FF; emissiveIntensity: 0.65">
  </a-text>

  <!-- ORNEMENTS LUMINEUX -->
  <a-sphere position="-0.32 -0.16 0.08"
    radius="0.008"
    color="#FFD76A"
    material="emissive: #FFD76A; emissiveIntensity: 2"
    animation="property: scale; to: 1.8 1.8 1.8; dir: alternate; dur: 900; loop: true">
  </a-sphere>

  <a-sphere position="0.32 -0.15 0.08"
    radius="0.009"
    color="#D9A9FF"
    material="emissive: #D9A9FF; emissiveIntensity: 2"
    animation="property: scale; to: 1.8 1.8 1.8; dir: alternate; dur: 1200; loop: true">
  </a-sphere>

  <a-sphere position="0.05 0.16 0.08"
    radius="0.006"
    color="#FFFFFF"
    material="emissive: #FFFFFF; emissiveIntensity: 2"
    animation="property: scale; to: 2 2 2; dir: alternate; dur: 1000; loop: true">
  </a-sphere>

</a-entity>




  </a-scene>

</body>
</html>
