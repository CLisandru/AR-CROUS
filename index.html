
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR CROUS - Transformation magique</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/crous.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Contenu affiché lorsque l'enseigne est reconnue -->
    
<a-entity mindar-image-target="targetIndex: 0">

  <!-- Halo magique -->
  <a-torus
    position="0 0 0"
    rotation="0 0 0"
    radius="0.42"
    radius-tubular="0.012"
    color="#B66CFF"
    material="emissive: #8A2BE2; emissiveIntensity: 2"
    animation="property: rotation; to: 0 0 360; dur: 12000; loop: true; easing: linear">
  </a-torus>

  <!-- Tasse à café -->
  <a-entity position="-0.25 0 0.08"
    animation="property: position; to: -0.25 0.07 0.08; dir: alternate; dur: 1800; loop: true">

    <!-- Corps -->
    <a-cylinder
      position="0 0 0"
      radius="0.12"
      height="0.22"
      color="#D6A6FF"
      material="metalness: 0.3; roughness: 0.25">
    </a-cylinder>

    <!-- Café -->
    <a-circle
      position="0 0.112 0"
      rotation="-90 0 0"
      radius="0.105"
      color="#60351F">
    </a-circle>

    <!-- Anse -->
    <a-torus
      position="0.14 0 0"
      rotation="90 0 90"
      radius="0.065"
      radius-tubular="0.014"
      color="#E6C6FF">
    </a-torus>

    <!-- Soucoupe -->
    <a-cylinder
      position="0 -0.13 0"
      radius="0.17"
      height="0.025"
      color="#F1D7FF">
    </a-cylinder>
  </a-entity>

  <!-- Vapeur -->
  <a-entity position="-0.25 0.18 0.08">
    <a-sphere radius="0.025" color="#FFFFFF"
      material="transparent: true; opacity: 0.6"
      animation="property: position; to: 0 0.22 0; dur: 1800; loop: true">
    </a-sphere>
    <a-sphere position="0.06 0.04 0" radius="0.02"
      color="#E5C5FF"
      material="transparent: true; opacity: 0.5"
      animation="property: position; to: 0.06 0.25 0; dur: 2200; loop: true">
    </a-sphere>
  </a-entity>

  <!-- Gobelet à emporter -->
  <a-entity position="0.24 -0.05 0.08"
    animation="property: rotation; to: 0 360 0; dur: 9000; loop: true">

    <a-cone
      radius-bottom="0.09"
      radius-top="0.065"
      height="0.24"
      color="#F3E7FF"
      material="metalness: 0.2; roughness: 0.3">
    </a-cone>

    <a-cylinder
      position="0 0.13 0"
      radius="0.075"
      height="0.025"
      color="#A45BDB">
    </a-cylinder>

    <a-cylinder
      position="0 0.15 0"
      radius="0.015"
      height="0.18"
      color="#FFFFFF">
    </a-cylinder>
  </a-entity>

  <!-- Cupcake -->
  <a-entity position="0 -0.32 0.08"
    animation="property: position; to: 0 -0.25 0.08; dir: alternate; dur: 1600; loop: true">

    <a-cone
      radius-bottom="0.09"
      radius-top="0.13"
      height="0.16"
      color="#C98B60">
    </a-cone>

    <a-sphere
      position="0 0.12 0"
      radius="0.12"
      scale="1 0.8 1"
      color="#FFB5E8"
      material="emissive: #FF69B4; emissiveIntensity: 0.4">
    </a-sphere>

    <a-sphere
      position="0 0.22 0"
      radius="0.035"
      color="#FFE680">
    </a-sphere>
  </a-entity>

  <!-- Particules magiques -->
  <a-sphere position="-0.38 0.3 0.1" radius="0.025"
    color="#FFE680"
    material="emissive: #FFD700; emissiveIntensity: 2"
    animation="property: position; to: -0.32 0.42 0.1; dir: alternate; dur: 1300; loop: true">
  </a-sphere>

  <a-sphere position="0.36 0.28 0.1" radius="0.018"
    color="#FFFFFF"
    material="emissive: #FFFFFF; emissiveIntensity: 2"
    animation="property: position; to: 0.42 0.38 0.1; dir: alternate; dur: 1700; loop: true">
  </a-sphere>

  <a-sphere position="0.38 -0.25 0.1" radius="0.025"
    color="#E3A6FF"
    material="emissive: #C060FF; emissiveIntensity: 2"
    animation="property: position; to: 0.32 -0.35 0.1; dir: alternate; dur: 1500; loop: true">
  </a-sphere>

  <!-- Texte magique -->
  <a-text
    value="CROUS"
    position="0 0.48 0.1"
    align="center"
    color="#FFE59A"
    width="1.8">
  </a-text>

  <a-text
    value="CAFETERIA MAGIQUE"
    position="0 0.39 0.1"
    align="center"
    color="#FFFFFF"
    width="1.4">
  </a-text>

</a-entity>


  </a-scene>

</body>
</html>
